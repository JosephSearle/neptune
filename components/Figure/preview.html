<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Figure</title>
<style>body{margin:0;padding:24px}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--space-8);align-items:start}@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}</style></head>
<body class="np-root">
<div class="grid">
  <figure class="np-figure">
    <div class="np-figure__frame">
      <div class="np-figure__media np-slot"><span>[ Image · 16:9 ]</span></div>
    </div>
    <figcaption class="np-figure__caption"><span class="np-figure__num">Fig. 01</span><span>Request path from the agent to the MCP gateway.</span></figcaption>
  </figure>
  <figure class="np-figure np-ratio-square">
    <div class="np-figure__frame">
      <div class="np-figure__media np-slot"><span>[ Image · 1:1 ]</span></div>
    </div>
    <figcaption class="np-figure__caption"><span class="np-figure__num">Fig. 02</span><span>Star chart, halftone.</span></figcaption>
  </figure>
</div>
</body>
</html>
