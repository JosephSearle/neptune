<!-- @dsCard group="Content" height=230 subtitle="Copyable code block and inline code" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Code copy</title>
<style>body{margin:0;padding:24px}p{margin:0;font-size:16px;line-height:24px}</style></head>
<body class="np-root">
<div class="np-stack">
  <div class="np-code">
    <div class="np-code__head"><span>bash</span><button class="np-code__copy" type="button">Copy</button></div>
<pre><code><span class="p">$</span> <span class="c">npx neptune init</span>
<span class="p">$</span> <span class="c">export API_BASE_URL=https://api.example.dev</span></code></pre>
  </div>
  <p>Set <code class="np-code-inline">API_BASE_URL</code> before the first run.</p>
</div>
<script>
document.querySelectorAll('.np-code__copy').forEach(function (b) {
  b.addEventListener('click', function () {
    var text = b.closest('.np-code').querySelector('code').innerText.replace(/^\$ /gm, '');
    var done = function () { b.textContent = 'Copied'; b.setAttribute('data-copied', ''); setTimeout(function () { b.textContent = 'Copy'; b.removeAttribute('data-copied'); }, 1500); };
    try { navigator.clipboard.writeText(text).then(done, done); } catch (e) { done(); }
  });
});
</script>
</body>
</html>
