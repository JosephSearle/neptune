<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>ThemeToggle</title>
<style>body{margin:0;padding:24px}</style></head>
<body class="np-root">
<div class="np-theme" role="group" aria-label="Theme">
  <button type="button" aria-pressed="true" data-set="light">Paper</button>
  <button type="button" aria-pressed="false" data-set="dark">Deep</button>
</div>
<script>
document.querySelectorAll('.np-theme button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.documentElement.setAttribute('data-theme', b.dataset.set);
    document.querySelectorAll('.np-theme button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
  });
});
</script>
</body>
</html>
