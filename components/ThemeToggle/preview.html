<!-- @dsCard group="Actions" height=72 subtitle="Paper / Deep" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<!-- Inline in <head>, before the stylesheets: applies a saved theme before first paint. neptune.js does the rest. -->
<script>try { var t = localStorage.getItem('np-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>ThemeToggle</title>
<style>body{margin:0;padding:24px}</style></head>
<body class="np-root">
<div class="np-theme" role="group" aria-label="Theme">
  <button type="button" aria-pressed="false" data-set="light">Paper</button>
  <button type="button" aria-pressed="false" data-set="dark">Deep</button>
</div>
<script src="../neptune.js" defer></script>
</body>
</html>
