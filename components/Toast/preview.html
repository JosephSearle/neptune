<!-- @dsCard group="Status" height=380 subtitle="Ok, alert with action, neutral" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Toast</title>
<style>body{margin:0;padding:24px;min-height:340px}.np-toasts{position:static}</style></head>
<body class="np-root">
<section class="np-toasts" aria-label="Notifications" aria-live="polite">
  <div class="np-toast np-toast--ok">
    <p class="np-toast__label"><span class="np-dot"></span> Published</p>
    <p class="np-toast__text">MCP servers in production is live at /playbooks/mcp.</p>
    <button class="np-toast__close" type="button">Dismiss</button>
  </div>
  <div class="np-toast np-toast--alert" role="alert">
    <p class="np-toast__label"><span class="np-dot"></span> Failed</p>
    <p class="np-toast__text">Deploy failed: missing API_BASE_URL. Set it in .env.</p>
    <div class="np-toast__actions"><button class="np-toast__action" type="button">View log</button></div>
    <button class="np-toast__close" type="button">Dismiss</button>
  </div>
  <div class="np-toast">
    <p class="np-toast__label">Archived</p>
    <p class="np-toast__text">3 notes moved to the archive.</p>
    <div class="np-toast__actions"><button class="np-toast__action" type="button">Undo</button></div>
    <button class="np-toast__close" type="button">Dismiss</button>
  </div>
</section>
<script src="../neptune.js" defer></script>
</body>
</html>
