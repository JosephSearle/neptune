<!-- @dsCard group="Navigation" height=520 subtitle="Open state, results grouped; ⌘K or the button reopens it as a modal" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>SearchDialog</title>
<style>body{margin:0;padding:24px}.stage{position:relative;min-height:440px}.stage .np-search{position:static;margin:var(--space-6) 0 0}</style></head>
<body class="np-root">
<div class="stage">
  <button class="np-nav__search" type="button"><span class="np-search-text">Search</span> <kbd class="np-kbd">⌘</kbd><kbd class="np-kbd">K</kbd></button>
  <!-- Preview only: shown open in place. ⌘K or the button reopens it as a modal. -->
  <dialog class="np-search" aria-label="Search" open>
    <form class="np-search__box" method="dialog">
      <span class="np-input"><input type="search" value="gateway" aria-label="Search notes and playbooks" autocomplete="off" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="search-results" aria-activedescendant="r-1"></span>
      <kbd class="np-kbd">Esc</kbd>
    </form>
    <div class="np-search__results" id="search-results" role="listbox" aria-label="Results">
      <div role="group" aria-labelledby="g-playbooks">
        <p class="np-search__group" id="g-playbooks">Playbooks</p>
        <ul class="np-search__list" role="none">
          <li role="none"><a class="np-search__item" href="#" role="option" id="r-1" tabindex="-1" aria-selected="true"><span>Install the <mark>gateway</mark></span><span class="np-meta">MCP</span></a></li>
          <li role="none"><a class="np-search__item" href="#" role="option" id="r-2" tabindex="-1" aria-selected="false"><span>Rotating the <mark>gateway</mark> key</span><span class="np-meta">MCP</span></a></li>
        </ul>
      </div>
      <div role="group" aria-labelledby="g-notes">
        <p class="np-search__group" id="g-notes">Notes</p>
        <ul class="np-search__list" role="none">
          <li role="none"><a class="np-search__item" href="#" role="option" id="r-3" tabindex="-1" aria-selected="false"><span>One <mark>gateway</mark> for every tool</span><span class="np-meta">2026-10-08</span></a></li>
        </ul>
      </div>
    </div>
    <div class="np-search__foot"><span>↑ ↓ move</span><span>↵ open</span><span>Esc close</span></div>
  </dialog>
</div>
<script src="../neptune.js" defer></script>
</body>
</html>
