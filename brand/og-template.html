<!doctype html>
<!-- Neptune social card, 1200×630. Open with ?kind=Playbook&title=…&date=2026-10-13 and screenshot at 1200×630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neptune social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=block">
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-serif); }
  .card { position: relative; display: grid; grid-template-columns: 1fr 360px; height: 630px; }
  .text { display: flex; flex-direction: column; justify-content: space-between; padding: 64px; border-right: 1px solid var(--line-strong); }
  .stamp, .foot { margin: 0; font-family: var(--font-mono); font-size: 18px; line-height: 24px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
  h1 { margin: 0; font-size: 72px; line-height: 76px; font-weight: 400; letter-spacing: -0.015em; text-wrap: balance; }
  .foot { display: flex; justify-content: space-between; letter-spacing: 0.04em; }
  .slab { background: var(--neptune); display: grid; place-items: center; }
  .slab svg { width: 240px; height: 240px; }
  .slab path { fill: var(--on-neptune); }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <p class="stamp" id="stamp">Neptune / 1.1 · LDN</p>
    <h1 id="title">An engineer's notebook, printed on paper.</h1>
    <p class="foot"><span id="kind">Joseph Searle</span><span id="date"></span></p>
  </div>
  <div class="slab" aria-hidden="true"><svg viewBox="4 2 16 20"><path d="M6 4h2v6h8V4h2v8h-5v3h3v2h-3v3h-2v-3H8v-2h3v-3H6z M11 4h2v6h-2z"/></svg></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  ['title', 'kind', 'date', 'stamp'].forEach(function (k) { if (q.get(k)) document.getElementById(k).textContent = q.get(k); });
  if (q.get('theme')) document.documentElement.setAttribute('data-theme', q.get('theme'));
</script>
</body>
</html>
