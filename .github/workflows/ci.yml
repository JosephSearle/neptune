name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DTCG tokens and tokens.css match tokens.json
        run: node scripts/build-tokens.mjs --check
      - name: Every documented colour pair meets WCAG contrast in both themes
        run: node scripts/check-contrast.mjs
      - name: llms.txt and llms-full.txt are up to date
        run: node scripts/build-llms.mjs --check
      - name: neptune.js parses
        run: node --check components/neptune.js
      - name: No raw colours or z-index values in component CSS
        run: npm run lint
      - name: A git install ships the whitelisted files and runs nothing
        run: node scripts/check-pack.mjs
