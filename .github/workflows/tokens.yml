name: tokens

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check DTCG tokens and tokens.css match tokens.json
        run: node scripts/build-tokens.mjs --check
      - name: Check llms.txt and llms-full.txt are up to date
        run: node scripts/build-llms.mjs --check
